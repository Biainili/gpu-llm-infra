---
- name: Configure NVIDIA GPU drivers and Container Toolkit
  when: has_nvidia_gpu | bool
  block:
    - name: Install Linux kernel headers and NVIDIA Server driver
      ansible.builtin.apt:
        name:
          - "linux-headers-{{ ansible_facts['kernel'] }}"
          - "{{ nvidia_driver_package }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      notify: Reboot server for nvidia driver

    - name: Download NVIDIA Container Toolkit GPG key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add NVIDIA Container Toolkit APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
          https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
        filename: nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Install NVIDIA Container Toolkit package
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: not ansible_check_mode

    - name: Check if Docker daemon.json configuration file exists
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: nvidia_gpu_daemon_stat

    - name: Read existing Docker daemon.json configuration
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: nvidia_gpu_daemon_content
      when: nvidia_gpu_daemon_stat.stat.exists

    - name: Configure NVIDIA runtime in Docker daemon.json idempotently
      ansible.builtin.command:
        cmd: nvidia-ctk runtime configure --runtime=docker
      when: >-
        not nvidia_gpu_daemon_stat.stat.exists or
        ('nvidia' not in (nvidia_gpu_daemon_content.content | default('') | b64decode))
      changed_when: true
      notify: Restart docker for nvidia

    - name: Flush handlers to apply reboot and Docker runtime restart before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify NVIDIA GPU driver and SMI status
      ansible.builtin.command:
        cmd: nvidia-smi
      register: nvidia_gpu_smi_output
      changed_when: false
      failed_when: nvidia_gpu_smi_output.rc != 0
